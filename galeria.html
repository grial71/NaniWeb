    <style>
        :root { --text-main: #111111; --accent: #e11048; --border-soft: #e5e5e5; --bg-light: #faf9f7; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-main); line-height:1.6; }
        header { background: #fff; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 2000; height: 75px; display: flex; justify-content: center; align-items: center; }
        .header-inner { width: 100%; max-width: 1200px; padding: 0 1rem; display: flex; align-items: center; justify-content: center; position: relative; }
        .header-logo img { height: 55px; }
        .hamburger { position: absolute; right: 1rem; font-size: 2rem; cursor: pointer; display: none; background: none; border: none; }
        nav { background: #fff; border-bottom: 1px solid var(--border-soft); position: sticky; top: 75px; z-index: 1500; }
        .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0.8rem 1rem; display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap; }
        nav a { color: var(--text-main); text-decoration: none; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.08em; padding: 0.5rem 0; }
        nav a:hover { color: var(--accent); }
        h2 { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.6rem; margin: 3.5rem 0 2rem; color: var(--text-main); }
        .gallery-grid { max-width: 1400px; margin: 0 auto; padding: 0 1rem 4rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.8rem; }
        .gallery-card { border-radius: 14px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.12); cursor: pointer; transition: all .35s ease; }
        .gallery-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.22); }
        .gallery-card img { width: 100%; height: 300px; object-fit: cover; display: block; }
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.96); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 95%; max-height: 95vh; border-radius: 14px; box-shadow: 0 15px 50px rgba(0,0,0,0.7); }
        .lightbox-close, .lightbox-arrow { position: absolute; color: white; font-size: 3.8rem; cursor: pointer; user-select: none; font-weight: 200; }
        .lightbox-close { top: 25px; right: 30px; }
        .lightbox-arrow.left { left: 25px; }
        .lightbox-arrow.right { right: 25px; }
        @media (max-width: 768px) { .hamburger { display: block; } nav { display: none; } nav.open { display: block; } .nav-inner { flex-direction: column; text-align: center; padding: 2.5rem 0; gap: 2rem; } .gallery-card img { height: 210px; } }
    </style>

<div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">×</span>
    <span class="lightbox-arrow left" onclick="prevImage()">‹</span>
    <img id="lightbox-img" alt="">
    <span class="lightbox-arrow right" onclick="nextImage()">›</span>
</div>

<script>
function toggleMenu() { document.getElementById("menuCategorias").classList.toggle("open"); }
let currentIndex = 0;
const allImages = []; // Se llena automáticamente con las rutas de arriba
function openLightbox(index) { currentIndex = index; document.getElementById("lightbox-img").src = allImages[index]; document.getElementById("lightbox").classList.add("active"); }
function closeLightbox() { document.getElementById("lightbox").classList.remove("active"); }
function nextImage() { currentIndex = (currentIndex + 1) % allImages.length; openLightbox(currentIndex); }
function prevImage() { currentIndex = (currentIndex - 1 + allImages.length) % allImages.length; openLightbox(currentIndex); }
document.getElementById("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLightbox(); });
</script>
