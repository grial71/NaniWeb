<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería – Nany Moda Consciente</title>

    <style>
        :root {
            --text-main: #111111;
            --accent: #e11d48;
            --border-soft: #e5e5e5;
            --bg-light: #ffffff;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg-light);
            color: var(--text-main);
        }

        /* ========== HEADER ========= */
        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 0;
            z-index: 2000;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-inner {
            width: 100%;
            max-width: 1200px;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header-logo img {
            height: 55px;
        }

        /* ===== Hamburguesa móvil ===== */
        .hamburger {
            position: absolute;
            right: 1rem;
            font-size: 2rem;
            cursor: pointer;
            display: none;
            user-select: none;
        }

        /* ========== MENU CATEGORÍAS ========= */
        nav {
            background: #ffffff;
            border-bottom: 1px solid var(--border-soft);
            position: sticky;
            top: 75px;
            z-index: 1500;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.95rem;
            position: relative;
        }

        nav a:hover::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }

        /* ========== GALERÍAS ========= */
        h2 {
            text-align: center;
            font-size: 2rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .gallery-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 1rem;
        }

        .gallery-card {
            border-radius: 0.7rem;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            cursor: pointer;
            transition: .3s;
        }

        .gallery-card:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .gallery-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        /* ========== LIGHTBOX ========= */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 1rem;
        }

        .lightbox-close,
        .lightbox-arrow {
            position: absolute;
            color: white;
            font-size: 3rem;
            cursor: pointer;
        }

        .lightbox-close { top: 2rem; right: 2rem; }
        .lightbox-arrow.left { top: 50%; left: 2rem; transform: translateY(-50%); }
        .lightbox-arrow.right { top: 50%; right: 2rem; transform: translateY(-50%); }

        /* ========== MOBILE ========= */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            nav { display: none; }
            nav.open { display: block; animation: fadeIn 0.3s ease; }
            .nav-inner { flex-direction: column; text-align: center; gap: 1.2rem; padding: 1.5rem 0; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .gallery-card img { height: 180px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="header-logo">
            <img src="logo-nany.png" alt="Nany Logo">
        </div>

        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </div>
</header>

<nav id="menuCategorias">
    <div class="nav-inner">
        <a href="index.html">Inicio</a>
        <a href="#pasarelas">Pasarelas</a>
        <a href="#abanicos">Abanicos</a>
        <a href="#sacs">Bolsos</a>
        <a href="#bisuteria">Bisutería</a> 
        <a href="#sandalias">Sandalias</a>
    </div>
</nav>

<h2 id="pasarelas">Pasarelas</h2>
<div class="gallery-grid" id="galeria-pasarelas"></div>

<h2 id="abanicos">Abanicos</h2>
<div class="gallery-grid" id="galeria-abanicos"></div>

<h2 id="sacs">Bolsos</h2>
<div class="gallery-grid" id="galeria-sacs"></div>

<h2 id="bisuteria">Bisutería</h2>
<div class="gallery-grid" id="galeria-bisuteria"></div>

<h2 id="sandalias">Sandalias</h2>
<div class="gallery-grid" id="galeria-sandalias"></div>

<div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="cerrarLightbox()">×</span>
    <span class="lightbox-arrow left" onclick="imagenAnterior()">❮</span>
    <img id="lightbox-img">
    <span class="lightbox-arrow right" onclick="imagenSiguiente()">❯</span>
</div>


<script>
// --- DONNÉES DE LA GALERIE (LISTES EXACTES DES FICHIERS) ---
// Ceci est la meilleure approche pour gérer les numérotations non séquentielles ou les extensions mélangées (.png et .jpg)
const galleryData = [
    {
        id: "galeria-pasarelas",
        dossier: "pasarelas",
        // J'utilise ici un générateur, car cette liste est très longue et bien séquencée
        fichiers: Array.from({ length: 149 }, (_, i) => `desf${i + 1}.jpg`)
    },
    {
        id: "galeria-abanicos",
        dossier: "abanicos",
        // Liste exacte des fichiers que vous avez fournie (corrigée si des numéros manquent)
        fichiers: [
            "AB1.png", "AB10.jpg", "AB11.jpg", "AB12.jpg", "AB13.jpg", 
            "AB14.jpg", "AB15.jpg", "AB16.jpg", "AB17.jpg", "AB18.jpg", 
            "AB19.jpg", "AB2.png", "AB4.png", "AB5.png", "AB6.png", 
            "AB7.jpg", "AB8.jpg", "AB20.jpg" // J'ai ajouté AB20.jpg en extension si AB20 existe
        ]
    },
    {
        id: "galeria-sacs",
        dossier: "sacs",
        fichiers: Array.from({ length: 14 }, (_, i) => `BOL${i + 1}.jpg`)
    },
    {
        id: "galeria-bisuteria",
        dossier: "bisutérie", // Attention à l'accent dans le nom du dossier
        fichiers: Array.from({ length: 54 }, (_, i) => `BISOU${i + 1}.jpg`)
    },
    {
        id: "galeria-sandalias",
        dossier: "sandalias",
        // Liste exacte des fichiers que vous avez fournie (corrigée)
        fichiers: [
            "SAN1.jpg", "SAN10.png", "SAN11.jpg", "SAN12.jpg", "SAN13.jpg", 
            "SAN14.jpg", "SAN15.jpg", "SAN16.jpg", "SAN17.jpg", "SAN18.jpg", 
            "SAN19.jpg", "SAN2.png", "SAN20.jpg", "SAN21.jpg", "SAN22.jpg", 
            "SAN3.jpg", "SAN4.jpg", "SAN5.jpg", "SAN6.jpg", "SAN7.jpg", "SAN8.jpg", "SAN9.jpg"
        ]
    }
];
// Note sur les listes : J'ai dû estimer quelques numéros manquants dans les listes des sacs et bisuterie. Vérifiez si vous avez bien les fichiers BOL1 à BOL14 et BISOU1 à BISOU54.

// --- FONCTIONS EXISTANTES AMÉLIORÉES ---

/* Menu mobile */
function toggleMenu() {
    document.getElementById("menuCategorias").classList.toggle("open");
}

/* Lightbox - Variables globales et fonctions pour la modal */
let lightbox = document.getElementById("lightbox");
let lightboxImg = document.getElementById("lightbox-img");
let allImages = []; // Contient TOUS les chemins d'images de toutes les galeries
let currentIndex = 0;

function openLightbox(index) {
    currentIndex = index;
    lightboxImg.src = allImages[index];
    lightbox.classList.add("active");
}

function closeLightbox() { lightbox.classList.remove("active"); }

function nextImage() {
    currentIndex = (currentIndex + 1) % allImages.length;
    lightboxImg.src = allImages[currentIndex];
}

function prevImage() {
    currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
    lightboxImg.src = allImages[currentIndex];
}

// Fermeture en cliquant en dehors de l'image
lightbox.addEventListener("click", (e) => {
    // Si l'élément cliqué est le lightbox lui-même, on ferme
    if (e.target === lightbox) {
        closeLightbox();
    }
});


/* Chargement des galeries (NOUVELLE VERSION ROBUSTE) */
function loadGalleries() {
    galleryData.forEach(gallery => {
        const divGallery = document.getElementById(gallery.id);
        
        gallery.fichiers.forEach(fileName => {
            // Création du chemin d'accès complet : "dossier/nom_du_fichier.ext"
            const fullPath = `${gallery.dossier}/${fileName}`;
            
            // 1. Ajouter le chemin à notre liste globale pour la Lightbox
            allImages.push(fullPath); 
            
            // 2. Créer la carte (miniature) dans la grille
            let card = document.createElement("div");
            card.classList.add("gallery-card");

            let img = document.createElement("img");
            img.src = fullPath;
            img.alt = `Image de ${gallery.dossier}`; // Texte alternatif descriptif
            
            // 3. Lien de l'image miniature vers la Lightbox
            // Nous utilisons l'index de l'image dans la liste globale 'allImages'
            const globalIndex = allImages.indexOf(fullPath);
            img.onclick = () => openLightbox(globalIndex);

            card.appendChild(img);
            divGallery.appendChild(card);
        });
    });
}

// --- DÉMARRAGE : Appel de la fonction pour charger toutes les galeries ---
document.addEventListener("DOMContentLoaded", loadGalleries);

</script>

</body>
</html>
