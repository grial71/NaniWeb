<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería – Nany Moda Consciente</title>

  <style>
    :root {
      --text-main: #111111;
      --accent: #e11d48;
      --border-soft: #e5e5e5;
      --bg-light: #ffffff;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg-light);
      color: var(--text-main);
    }

    /* HEADER */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo img {
      height: 50px;
    }

    .header-right span {
      margin-left: 1rem;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* NAV */
    nav {
      border-bottom: 1px solid var(--border-soft);
      background: white;
      position: sticky;
      top: 65px;
      z-index: 999;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.95rem;
      position: relative;
    }

    nav a:hover::after {
      content: "";
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
    }

    /* TITULOS */
    h2 {
      text-align: center;
      font-size: 2rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* GALERÍA */
    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
    }

    .gallery-card {
      border-radius: 0.7rem;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: .3s;
    }

    .gallery-card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }

    .gallery-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 1rem;
    }

    .lightbox-close, .lightbox-arrow {
      position: absolute;
      color: white;
      font-size: 3rem;
      cursor: pointer;
    }

    .lightbox-close {
      top: 2rem;
      right: 2rem;
    }

    .lightbox-arrow.left {
      top: 50%;
      left: 2rem;
      transform: translateY(-50%);
    }

    .lightbox-arrow.right {
      top: 50%;
      right: 2rem;
      transform: translateY(-50%);
    }

  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="header-logo">
      <img src="logo-nany.png" alt="Nany">
    </div>
    <div class="header-right">
      <span>🔍</span>
      <span>👤</span>
      <span>♡</span>
      <span>🛒</span>
    </div>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="index.html">Inicio</a>
    <a href="#pasarelas">Pasarelas</a>
    <a href="#abanicos">Abanicos</a>
    <a href="#sacs">Bolsos</a>
    <a href="#bisuteria">Bisutería</a>
    <a href="#sandalias">Sandalias</a>
  </div>
</nav>

<!-- GALERÍAS -->
<h2 id="pasarelas">Pasarelas</h2>
<div class="gallery-grid" id="galeria-pasarelas"></div>

<h2 id="abanicos">Abanicos</h2>
<div class="gallery-grid" id="galeria-abanicos"></div>

<h2 id="sacs">Bolsos</h2>
<div class="gallery-grid" id="galeria-sacs"></div>

<h2 id="bisuteria">Bisutería</h2>
<div class="gallery-grid" id="galeria-bisuteria"></div>

<h2 id="sandalias">Sandalias</h2>
<div class="gallery-grid" id="galeria-sandalias"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="cerrarLightbox()">×</span>
  <span class="lightbox-arrow left" onclick="imagenAnterior()">❮</span>
  <img id="lightbox-img">
  <span class="lightbox-arrow right" onclick="imagenSiguiente()">❯</span>
</div>

<script>
let lightbox = document.getElementById("lightbox");
let lightboxImg = document.getElementById("lightbox-img");
let imagenes = [];
let indexActual = 0;

function abrirLightbox(i) {
  indexActual = i;
  lightboxImg.src = imagenes[i];
  lightbox.classList.add("active");
}

function cerrarLightbox() {
  lightbox.classList.remove("active");
}

function imagenSiguiente() {
  indexActual = (indexActual + 1) % imagenes.length;
  lightboxImg.src = imagenes[indexActual];
}

function imagenAnterior() {
  indexActual = (indexActual - 1 + imagenes.length) % imagenes.length;
  lightboxImg.src = imagenes[indexActual];
}

lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) cerrarLightbox();
});

/* Cargar galerías */
function cargarGaleria(id, carpeta, base, cantidad, ext="jpg") {
  const div = document.getElementById(id);

  for (let i = 1; i <= cantidad; i++) {
    let src = `${carpeta}/${base}${i}.${ext}`;
    imagenes.push(src);

    let card = document.createElement("div");
    card.classList.add("gallery-card");

    let img = document.createElement("img");
    img.src = src;
    img.onclick = () => abrirLightbox(imagenes.indexOf(src));

    card.appendChild(img);
    div.appendChild(card);
  }
}

/* CONFIGURACIÓN BASADA EN TUS DOSSIERS SUR GITHUB */
cargarGaleria("galeria-pasarelas", "pasarelas", "desf", 149);
cargarGaleria("galeria-abanicos", "abanicos", "AB", 18);
cargarGaleria("galeria-sacs", "sacs", "BOL", 14);
cargarGaleria("galeria-bisuteria", "bisutérie", "BISOU", 54);
cargarGaleria("galeria-sandalias", "sandalias", "SAN", 23);
</script>

</body>
</html>
