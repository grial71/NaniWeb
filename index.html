<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NANY | Haute Couture</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@100;200;300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --oro: #D4AF37; --negro: #000000; --blanco: #ffffff;
            --border-glass: rgba(212, 175, 55, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--negro); color: var(--blanco); overflow-x: hidden; }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; height: 80px; padding: 0 5%;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; background: rgba(0,0,0,0.9); border-bottom: 1px solid var(--border-glass);
        }
        .nav-logo img { height: 50px; width: auto; border: 1px solid red; /* Cadre rouge pour voir si le logo est là */ }

        /* GALLERY */
        .gallery-container { padding: 120px 5% 50px; }
        .grid-master { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .art-item { height: 400px; border: 1px solid var(--border-glass); position: relative; background: #111; }
        .art-item img { width: 100%; height: 100%; object-fit: cover; }

        /* BOUTONS FIXES */
        .social-float { position: fixed; right: 25px; bottom: 25px; display: flex; flex-direction: column; gap: 15px; z-index: 9999; }
        .s-btn { width: 55px; height: 55px; border-radius: 50%; background: #000; border: 1px solid var(--oro); color: var(--oro); display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 1.5rem; }
        
        .music-btn { position: fixed; left: 25px; bottom: 25px; width: 55px; height: 55px; border-radius: 50%; background: #000; border: 1px solid var(--oro); color: var(--oro); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 9999; }
    </style>
</head>
<body>

    <header>
        <div class="nav-logo">
            <img src="Assets/logo-nany.png" alt="Logo">
        </div>
        <div id="google_translate_element"></div>
    </header>

    <main class="gallery-container">
        <h2 style="text-align: center; color: var(--oro); margin-bottom: 30px; font-family: 'Playfair Display';">CATÁLOGO EXCLUSIVO</h2>
        <div class="grid-master" id="gallery-render"></div>
    </main>

    <div class="music-btn" onclick="togglePlay()"><i class="fas fa-music"></i></div>
    <audio id="track" loop src="Assets/afrobeat nany.mp3"></audio>

    <div class="social-float">
        <a href="https://wa.me/240555517225" class="s-btn"><i class="fab fa-whatsapp"></i></a>
        <a href="https://www.tiktok.com/@mickael8881" class="s-btn"><i class="fab fa-tiktok"></i></a>
    </div>

    <script>
        // ON TESTE LES DEUX EXTENSIONS POSSIBLES (.jpg et .JPG)
        const categories = {
            'bolsos': ['BOL1.jpg', 'BOL10.jpg', 'BOL11.jpg', 'BOL1.JPG', 'BOL10.JPG'],
            'pasarelas': ['desf1.jpg', 'desf10.jpg', 'desf100.jpg', 'desf1.JPG', 'desf10.JPG'],
            'abanicos': ['AB1.png', 'AB10.jpg', 'AB1.PNG', 'AB10.JPG']
        };

        const render = () => {
            const grid = document.getElementById('gallery-render');
            Object.keys(categories).forEach(cat => {
                categories[cat].forEach(imgName => {
                    const url = `Assets/${cat}/${imgName}`;
                    const div = document.createElement('div');
                    div.className = 'art-item';
                    div.innerHTML = `<img src="${url}" onerror="console.log('Erreur sur : ${url}')">
                                     <p style="font-size:10px; color:gray; text-align:center;">${imgName}</p>`;
                    grid.appendChild(div);
                });
            });
        };

        function togglePlay() {
            const t = document.getElementById('track');
            t.paused ? t.play() : t.pause();
        }

        window.onload = render;
    </script>
</body>
</html>
